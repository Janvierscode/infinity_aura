project_id = "infinity-aura"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/callback", "https://infinity-aura-technologies.vercel.app/auth/callback", "https://infinityaura.tech/auth/callback", "https://www.infinityaura.tech/auth/callback"]
enable_signup = true
minimum_password_length = 12

[storage]
enabled = true
file_size_limit = "10MiB"
